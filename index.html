<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Aura</title>
<style>
:root{--c:#7fe3ff;--c2:#2fb4ff;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#000;color:#e8f8ff;overflow:hidden;font:500 15px/1.35 -apple-system,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",sans-serif}
button{font:inherit;color:inherit;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--c);outline-offset:3px}
.glass{background:linear-gradient(135deg,rgba(255,255,255,.17),rgba(255,255,255,.04));-webkit-backdrop-filter:blur(30px) saturate(190%);backdrop-filter:blur(30px) saturate(190%);border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.38),inset 0 -1px 0 rgba(255,255,255,.06),0 14px 44px rgba(0,0,0,.65),0 0 46px rgba(127,227,255,.07)}
#app{height:100%;display:flex;flex-direction:column;align-items:center;padding:12px 16px 18px}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(26px,7vh,60px);width:100%;transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.playing .stage{transform:scale(.72)}
.eyes{display:flex;gap:clamp(60px,20vw,160px);transform:translate(var(--ex,0px),var(--ey,0px));transition:transform .25s ease-out}
.eye{width:clamp(40px,10vw,66px);height:clamp(62px,16vw,104px);border-radius:999px;background:var(--c);--b:1;transform:scale(calc(1 + var(--lv,0)*.1)) scaleY(var(--b));transition:transform .09s,box-shadow .4s,filter .4s;box-shadow:0 0 24px var(--c),0 0 80px rgba(47,180,255,.55)}
.listen .eye{--b:1.14;filter:brightness(1.2);box-shadow:0 0 34px var(--c),0 0 120px rgba(47,180,255,.8)}
.blink .eye{--b:.07}
.mouth{width:clamp(72px,22vw,124px);height:12px;background:var(--c);border-radius:6px 6px 24px 24px;box-shadow:0 0 22px var(--c),0 0 70px rgba(47,180,255,.5)}
.hint{min-height:2.7em;max-width:30ch;text-align:center;color:rgba(232,248,255,.62);margin:0 0 14px;font-size:14px}
.pw{width:100%;max-width:420px;max-height:0;opacity:0;overflow:hidden;transform:translateY(24px) scale(.96);transition:max-height .7s cubic-bezier(.2,.8,.2,1),opacity .5s,transform .7s cubic-bezier(.2,.8,.2,1),margin .5s;margin:0}
.playing .pw{max-height:230px;opacity:1;transform:none;margin:0 0 14px}
.player{display:flex;gap:18px;align-items:center;padding:16px;border-radius:32px}
.cd{flex:none;width:112px;height:112px;border-radius:50%;position:relative;background:radial-gradient(circle,#000 0 8%,rgba(255,255,255,.55) 8% 10.5%,rgba(10,20,30,.55) 10.5% 24%,transparent 24%),conic-gradient(from 20deg,#bff4ff,#7aa8ff,#f2c8ff,#9ffff0,#8fd0ff,#fff,#9be7ff,#c6a8ff,#bff4ff);box-shadow:0 0 30px rgba(127,227,255,.35),inset 0 0 0 2px rgba(255,255,255,.35);animation:spin 3.2s linear infinite;animation-play-state:paused}
.cd::after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 20%,rgba(255,255,255,.55) 25%,transparent 30% 70%,rgba(255,255,255,.4) 75%,transparent 80%);mix-blend-mode:overlay}
.spin .cd{animation-play-state:running}
@keyframes spin{to{transform:rotate(360deg)}}
.info{flex:1;min-width:0}
.title{font-weight:650;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{color:rgba(232,248,255,.6);font-size:13px;margin-bottom:8px}
.ctl{display:flex;align-items:center;gap:6px}
.ib{width:44px;height:44px;border-radius:50%;background:transparent;display:grid;place-items:center;transition:background .2s,transform .15s}
.ib:active{transform:scale(.9);background:rgba(255,255,255,.14)}
.ib.big{width:52px;height:52px;background:rgba(127,227,255,.22);box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
svg{width:22px;height:22px;fill:currentColor}
#vol{width:100%;margin:8px 0 0;accent-color:var(--c)}
.dock{display:flex;align-items:center;gap:22px;padding:10px 18px;border-radius:44px}
.round{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.08)}
.mic{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 25%,rgba(255,255,255,.55),rgba(127,227,255,.35) 55%,rgba(47,180,255,.3));color:#00121a;box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 0 30px rgba(127,227,255,.45);position:relative}
.mic svg{width:30px;height:30px}
.listen .mic::before{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px solid var(--c);animation:ring 1.6s ease-out infinite}
@keyframes ring{from{transform:scale(.9);opacity:.9}to{transform:scale(1.35);opacity:0}}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .4s}
.sheet{position:fixed;left:50%;bottom:0;width:min(100%,460px);transform:translate(-50%,110%);transition:transform .6s cubic-bezier(.2,.8,.2,1);padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));border-radius:34px 34px 0 0;max-height:75%;overflow:auto}
.open .sheet{transform:translate(-50%,0)}
.open .scrim{opacity:1;pointer-events:auto}
.sheet h2{margin:2px 6px 10px;font-size:20px}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border-radius:18px;background:transparent;text-align:left}
.row:active,.row.on{background:rgba(127,227,255,.16)}
.row small{display:block;color:rgba(232,248,255,.55)}
.dot{width:34px;height:34px;border-radius:50%;flex:none;background:conic-gradient(#bff4ff,#7aa8ff,#f2c8ff,#9ffff0,#bff4ff);-webkit-mask:radial-gradient(circle,transparent 0 16%,#000 17%);mask:radial-gradient(circle,transparent 0 16%,#000 17%)}
.file{display:block;margin-top:8px;padding:14px;border-radius:18px;text-align:center;background:rgba(127,227,255,.2);font-weight:600;cursor:pointer}
.file input{display:none}
button.file{width:100%;border:0;font-size:15px}
@media (prefers-reduced-motion:reduce){.cd{animation-duration:12s}.listen .mic::before{animation:none}}
</style>
</head>
<body>
<div id="app">
  <div class="stage" id="stage">
    <div class="eyes"><div class="eye"></div><div class="eye"></div></div>
    <div class="mouth" id="mouth"></div>
  </div>

  <p class="hint" id="hint">Tocá el micrófono y decí “pon música”.</p>

  <div class="pw"><div class="player glass">
    <div class="cd" id="cd"></div>
    <div class="info">
      <div class="title" id="ttl">Aura</div>
      <div class="sub" id="sub"></div>
      <div class="ctl">
        <button class="ib" id="prev" aria-label="Anterior"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
        <button class="ib big" id="pp" aria-label="Reproducir o pausar"></button>
        <button class="ib" id="next" aria-label="Siguiente"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5l11 7-11 7z"/></svg></button>
      </div>
      <input id="vol" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Volumen">
    </div>
  </div></div>

  <div class="dock glass">
    <button class="round" id="listBtn" aria-label="Elegir música"><svg viewBox="0 0 24 24"><path d="M9 3v11.3A3.5 3.5 0 1 0 11 17.5V8h8V3z" transform="scale(.95) translate(.6 1)"/></svg></button>
    <button class="mic" id="mic" aria-label="Activar micrófono" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V22h2v-3.1A7 7 0 0 0 19 12z"/></svg></button>
    <button class="round" id="vib" aria-label="Vibrar"><svg viewBox="0 0 24 24"><path d="M8 4h8a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm1 2v12h6V6zM2 8h2v8H2zm18 0h2v8h-2z"/></svg></button>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet glass" id="sheet" role="dialog" aria-label="Música">
  <h2>Elegí qué escuchar</h2>
  <div id="list"></div>
  <button class="file" id="spBtn" type="button">Conectar con Spotify</button>
  <label class="file">Agregar música de mi teléfono<input id="file" type="file" accept="audio/*" multiple></label>
</div>

<script>
const $=s=>document.querySelector(s),app=$('#app'),mouth=$('#mouth');
const AC=window.AudioContext||window.webkitAudioContext;
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const PLAY='<svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg>',PAUSE='<svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zm8 0h4v16h-4z"/></svg>';
let ctx,master,an,bus,el,data,cur=-1,playing=false,speaking=false,want=false,rec,step=0,timer,nextT=0,vol=.8,level=0,sm=0,ph=0,mode='local',sp=null,spS=null,spTimer,vt;

/* ---------- Música sintetizada (sin archivos externos) ---------- */
const N=n=>440*2**((n-69)/12);
function tone(f,t,d,type,v){const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(bus);o.start(t);o.stop(t+d+.05)}
function kick(t){const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(40,t+.15);g.gain.setValueAtTime(.5,t);g.gain.exponentialRampToValueAtTime(.0001,t+.25);o.connect(g);g.connect(bus);o.start(t);o.stop(t+.3)}
const CH=[[57,60,64],[53,57,60],[48,52,55],[55,59,62]];
const T=[
 {name:'Neón',sub:'Sintetizador · 96 bpm',bpm:96,fn:(s,t,d)=>{const c=CH[(s>>4)&3];tone(N(c[s%3]+12),t,d*3,'triangle',.14);if(s%16==0)c.forEach(n=>tone(N(n-12),t,d*15,'sine',.09))}},
 {name:'Cian',sub:'Ambiente · 60 bpm',bpm:60,fn:(s,t,d)=>{const c=CH[(s>>4)&3];if(s%16==0)c.forEach(n=>tone(N(n),t,d*17,'sine',.1));if(s%8==4)tone(N(c[2]+24),t,d*7,'sine',.05)}},
 {name:'Pulso',sub:'Electrónica · 118 bpm',bpm:118,fn:(s,t,d)=>{const c=CH[(s>>5)&3];if(s%4==0)kick(t);if(s%4==2)tone(N(c[0]-12),t,d*3,'sawtooth',.08);if(s%2==1)tone(N(c[(s>>1)%3]+24),t,d*1.5,'square',.03)}}
];
function mkBus(){bus=ctx.createBiquadFilter();bus.type='lowpass';bus.frequency.value=4000;bus.connect(master)}
function init(){if(ctx)return;ctx=new AC();master=ctx.createGain();master.gain.value=vol;an=ctx.createAnalyser();an.fftSize=128;data=new Uint8Array(an.frequencyBinCount);master.connect(an);an.connect(ctx.destination);mkBus();el=new Audio();el.onended=()=>next();ctx.createMediaElementSource(el).connect(master)}
function sched(){const tr=T[cur],d=60/tr.bpm/4;while(nextT<ctx.currentTime+.3){tr.fn(step,nextT,d);step++;nextT+=d}}
function startSynth(){nextT=ctx.currentTime+.05;clearInterval(timer);timer=setInterval(sched,80)}
function halt(){clearInterval(timer);if(el)el.pause();if(ctx){bus.disconnect();mkBus()}}

async function play(i){init();await ctx.resume();halt();if(sp&&mode==='sp'&&spS&&spS.is_playing)spApi('/pause','PUT');mode='local';cur=(i+T.length)%T.length;const t=T[cur];step=0;try{if(t.url){el.src=t.url;await el.play()}else startSynth();playing=true}catch(e){say('No pude reproducir ese archivo.')}ui();meta()}
function pause(){if(sp&&mode==='sp'){spApi('/pause','PUT').then(()=>setTimeout(spPoll,300));return}if(!playing)return;halt();playing=false;ui()}
async function resume(){if(sp&&mode==='sp'){await spApi('/play','PUT');return void setTimeout(spPoll,400)}if(cur<0)return play(0);init();await ctx.resume();const t=T[cur];if(t.url)el.play();else startSynth();playing=true;ui()}
const spOnNow=()=>sp&&mode==='sp'&&spS&&spS.item;
const next=()=>{if(sp&&mode==='sp'){spApi('/next','POST');setTimeout(spPoll,500)}else play(cur+1)},prev=()=>{if(sp&&mode==='sp'){spApi('/previous','POST');setTimeout(spPoll,500)}else play(cur-1)},toggle=()=>(spOnNow()?spS.is_playing:playing)?pause():resume();
function setVol(v){vol=Math.min(1,Math.max(0,v));if(master)master.gain.value=vol;$('#vol').value=vol;if(sp&&mode==='sp'){clearTimeout(vt);vt=setTimeout(()=>spApi('/volume?volume_percent='+Math.round(vol*100),'PUT'),250)}}
function duck(on){if(master)master.gain.setTargetAtTime(on?vol*.25:vol,ctx.currentTime,.08)}

function cdArt(u){const c=$('#cd');if(c.dataset.a===u)return;c.dataset.a=u;if(u){c.style.backgroundImage='radial-gradient(circle,#000 0 8%,rgba(255,255,255,.55) 8% 10.5%,rgba(10,20,30,.55) 10.5% 24%,transparent 24%),url("'+u+'")';c.style.backgroundSize='cover'}else{c.style.backgroundImage='';c.style.backgroundSize=''}}
function ui(){
  const s=spOnNow(),ip=s?spS.is_playing:playing;
  app.classList.toggle('playing',!!s||cur>=0);$('#cd').parentNode.classList.toggle('spin',ip);
  $('#pp').innerHTML=ip?PAUSE:PLAY;
  if(s){$('#ttl').textContent=spS.item.name;$('#sub').textContent=spS.item.artists.map(a=>a.name).join(', ')+' · Spotify';cdArt((spS.item.album.images[0]||{}).url||'')}
  else{if(cur>=0){$('#ttl').textContent=T[cur].name;$('#sub').textContent=T[cur].sub}cdArt('')}
  document.querySelectorAll('.row').forEach((r,i)=>r.classList.toggle('on',!s&&i===cur));
}
function meta(){if(!('mediaSession' in navigator)||cur<0)return;navigator.mediaSession.metadata=new MediaMetadata({title:T[cur].name,artist:'Aura'});
  [['play',resume],['pause',pause],['nexttrack',next],['previoustrack',prev]].forEach(([a,f])=>{try{navigator.mediaSession.setActionHandler(a,f)}catch(e){}})}

/* ---------- Spotify (API oficial, login PKCE) ---------- */
const SP_ID='PEGA_TU_CLIENT_ID',SP_RED=location.origin+location.pathname,SP_SC='user-read-playback-state user-modify-playback-state user-read-currently-playing';
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
async function spLogin(){const v=b64(crypto.getRandomValues(new Uint8Array(48)));localStorage.setItem('sp_v',v);const ch=b64(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)));location.href='https://accounts.spotify.com/authorize?'+new URLSearchParams({client_id:SP_ID,response_type:'code',redirect_uri:SP_RED,scope:SP_SC,code_challenge_method:'S256',code_challenge:ch})}
async function spToken(body){try{const r=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({client_id:SP_ID,...body})});const j=await r.json();if(j.access_token){sp={token:j.access_token,exp:Date.now()+j.expires_in*1000-60000,ref:j.refresh_token||(sp&&sp.ref)};localStorage.setItem('sp_ref',sp.ref);return true}}catch(e){}return false}
async function spApi(path,method='GET'){if(!sp)return null;if(Date.now()>sp.exp)await spToken({grant_type:'refresh_token',refresh_token:sp.ref});if(!sp)return null;
  try{const r=await fetch('https://api.spotify.com/v1/me/player'+path,{method,headers:{Authorization:'Bearer '+sp.token}});
  if(r.status===204||r.status===202)return null;
  if(r.status===404){if(method!=='GET')say('Abrí Spotify en algún dispositivo y poné una canción.');return null}
  if(r.status===403){say('Spotify pide cuenta Premium para controlar la reproducción.');return null}
  return r.ok?await r.json().catch(()=>null):null}catch(e){return null}}
async function spPoll(){if(!sp)return;const s=await spApi('');if(s&&s.item){spS=s;if(s.is_playing&&mode!=='sp'){halt();playing=false;mode='sp'}else if(!playing&&cur<0)mode='sp'}else if(spS&&!s){spS.is_playing=false}ui()}
function spUI(){$('#spBtn').textContent=sp?'Spotify conectado · tocá para desconectar':'Conectar con Spotify'}
async function spInit(){const code=new URLSearchParams(location.search).get('code');
  if(code){history.replaceState({},'',SP_RED);await spToken({grant_type:'authorization_code',code,redirect_uri:SP_RED,code_verifier:localStorage.getItem('sp_v')})}
  else{const r=localStorage.getItem('sp_ref');if(r)await spToken({grant_type:'refresh_token',refresh_token:r})}
  spUI();if(sp){spPoll();if(!spTimer)spTimer=setInterval(spPoll,3000)}}
$('#spBtn').onclick=()=>{if(sp){localStorage.removeItem('sp_ref');sp=null;spS=null;mode='local';spUI();ui()}else if(SP_ID.startsWith('PEGA')){say('Falta pegar tu Client ID de Spotify en el código.')}else spLogin()};

/* ---------- Lista ---------- */
function renderList(){const l=$('#list');l.textContent='';T.forEach((t,i)=>{const b=document.createElement('button');b.className='row';const d=document.createElement('span');d.className='dot';const x=document.createElement('span');x.textContent=t.name;const s=document.createElement('small');s.textContent=t.sub;x.appendChild(s);b.append(d,x);b.onclick=()=>{play(i);sheet(false)};l.appendChild(b)});ui()}
function sheet(o){document.body.classList.toggle('open',o)}
$('#listBtn').onclick=()=>sheet(true);$('#scrim').onclick=()=>sheet(false);
$('#file').onchange=e=>{const f=[...e.target.files];if(!f.length)return;const first=T.length;f.forEach(x=>T.push({name:x.name.replace(/\.[^.]+$/,''),sub:'Desde tu teléfono',url:URL.createObjectURL(x)}));renderList();play(first);sheet(false)};

/* ---------- Voz: hablar y escuchar ---------- */
function say(txt){$('#hint').textContent=txt;if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang='es-AR';speaking=true;if(ctx)duck(true);
  const end=()=>{speaking=false;if(ctx)duck(false);if(want)startRec()};u.onend=end;u.onerror=end;if(rec)try{rec.stop()}catch(e){}speechSynthesis.speak(u)}
const norm=t=>t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[¿?¡!.,]/g,'').trim();
function handle(raw){
  const n=norm(raw);$('#hint').textContent='Escuché: “'+raw.trim()+'”';
  const byName=T.findIndex(t=>n.includes(norm(t.name)));
  if(/que (suena|cancion|tema)|como se llama/.test(n)){return say(spOnNow()?spS.item.name+', de '+spS.item.artists[0].name:cur>=0?T[cur].name:'No hay nada sonando.')}
  if(/spotify/.test(n)){if(!sp)return say('Primero conectá Spotify desde la lista.');mode='sp';return resume()}
  if(/^(pausa|pausar|para|parar|stop|deten\w*|frena\w*|callate)( la musica| musica)?$/.test(n))return pause();
  if(/(siguiente|proxim|otra cancion|cambia)/.test(n))return next();
  if(/(anterior|atras|volve)/.test(n))return prev();
  if(/(sub\w* (el )?volumen|mas (fuerte|alto|volumen)|volumen (arriba|mas))/.test(n))return setVol(vol+.2);
  if(/(baj\w* (el )?volumen|mas (bajo|suave)|volumen (abajo|menos))/.test(n))return setVol(vol-.2);
  if(/vibr/.test(n)){if(navigator.vibrate){navigator.vibrate([200,80,200]);return say('Listo, vibrando.')}return say('Este teléfono no deja vibrar desde el navegador.')}
  if(/hora/.test(n))return say('Son las '+new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'}));
  if(/(lista|canciones|que musica|que temas|opciones)/.test(n)){sheet(true);return say('Tengo '+T.map(t=>t.name).slice(0,5).join(', ')+'.')}
  if(byName>=0)return play(byName);
  if(/(^|\b)(pon|pone|reproduc\w*|play|musica|segui|continua|dale)\b/.test(n))return resume();
  if(/(hola|buenas|ey)/.test(n))return say('Hola. ¿Qué querés escuchar?');
}
function startRec(){try{rec.start()}catch(e){}}
function listen(on){
  if(on&&!SR){say('Tu navegador no entiende voz. Probá con Safari o Chrome.');return}
  want=on;app.classList.toggle('listen',on);$('#mic').setAttribute('aria-pressed',on);
  if(on){init();ctx.resume();rec=new SR();rec.lang='es-AR';rec.continuous=true;rec.interimResults=false;
    rec.onresult=e=>{const r=e.results[e.results.length-1];if(r.isFinal)handle(r[0].transcript)};
    rec.onend=()=>{if(want&&!speaking)startRec()};
    rec.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){want=false;app.classList.remove('listen');say('Necesito permiso para usar el micrófono.')}};
    startRec();$('#hint').textContent='Te escucho…'}
  else if(rec){rec.onend=null;try{rec.stop()}catch(e){}$('#hint').textContent='Micrófono apagado.'}
}
$('#mic').onclick=()=>listen(!want);
$('#vib').onclick=()=>{if(navigator.vibrate)navigator.vibrate([120,60,120]);else $('#hint').textContent='La vibración solo funciona en Android.'};
$('#pp').onclick=toggle;$('#next').onclick=next;$('#prev').onclick=prev;$('#vol').oninput=e=>setVol(+e.target.value);

/* ---------- Cara viva ---------- */
function loop(){requestAnimationFrame(loop);let m=0;
  if(mode==='sp'&&spS&&spS.is_playing){level=.3+.25*Math.abs(Math.sin(performance.now()/260));m=Math.min(1,level*1.6)}else if(an&&playing){an.getByteFrequencyData(data);let s=0;for(let i=0;i<10;i++)s+=data[i];level=s/2550;m=Math.min(1,level*1.7)}else level*=.9;
  if(speaking){ph+=.35;m=Math.max(m,.4+.35*Math.sin(ph)*Math.sin(ph*.37))}
  sm+=(m-sm)*.3;const h=12+sm*50,r=Math.min(64,h*2);
  mouth.style.height=h+'px';mouth.style.borderRadius='6px 6px '+r+'px '+r+'px';app.style.setProperty('--lv',level.toFixed(3))}
loop();
(function blink(){setTimeout(()=>{app.classList.add('blink');setTimeout(()=>app.classList.remove('blink'),140);blink()},2500+Math.random()*3000)})();
addEventListener('pointermove',e=>{const s=$('#stage');s.style.setProperty('--ex',((e.clientX/innerWidth-.5)*22).toFixed(1)+'px');s.style.setProperty('--ey',((e.clientY/innerHeight-.5)*14).toFixed(1)+'px')});
document.querySelector('.eyes').style.cssText='';
renderList();$('#pp').innerHTML=PLAY;spUI();if(!SP_ID.startsWith('PEGA'))spInit();
</script>
</body>
